<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#1b2b39" name="theme-color"/>
<title>Snowboard Runner</title>
<style>
    :root { color-scheme: dark; --bg:#1b2b39; --panel:#101d27; --panel2:#162735; --ink:#f3f7fa; --muted:#a0b7c4; --accent:#61edbf; --stroke:#354957; }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 78% 0%,#30496099,transparent 55%);z-index:-1}
    .site{width:min(1110px,calc(100% - 64px));margin:auto}.topbar{height:86px;display:flex;align-items:center;border-bottom:1px solid var(--stroke)}
    .brand{font-size:14px;font-weight:800;letter-spacing:.12em}.accent{color:var(--accent)}
    .hero{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:center;padding:66px 0 64px}
    .hero-title{font-size:clamp(47px,6.1vw,88px);line-height:1.02;letter-spacing:.025em;font-weight:800;margin:0;white-space:nowrap}
    .platform{display:block;margin-top:24px;letter-spacing:.18em;font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700}
    .hero-shot{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:12px;border:1px solid #6278894d;box-shadow:0 22px 55px #08121d70}
    .rule{height:1px;background:var(--stroke)}
    .gallery{padding:54px 0 52px}.gallery-frame{max-width:860px;margin:auto;position:relative}.slide-window{border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid #62788950;aspect-ratio:16/9;position:relative}
    .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease;pointer-events:none}.slide.active{opacity:1;pointer-events:auto}
    .arrow{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #6a859280;background:#0b1b27c9;color:white;width:42px;height:48px;border-radius:9px;cursor:pointer;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .2s}.arrow:hover{background:#1b4050}.arrow.prev{left:16px}.arrow.next{right:16px}
    .dots{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px}.dot{width:8px;height:8px;border-radius:50%;background:#657c88;border:0;padding:0;cursor:pointer;transition:background .2s,transform .2s}.dot.active{background:var(--accent);transform:scale(1.25)}
    .download{margin:0 0 56px;background:var(--panel);border:1px solid #334b58;border-radius:13px;padding:32px 38px;display:flex;align-items:center;justify-content:space-between;gap:25px}
    .download h2{font-size:23px;margin:0 0 12px;letter-spacing:.075em}.download p{margin:0;color:var(--muted);font-size:14px}
    .download-button{display:inline-flex;gap:13px;align-items:center;justify-content:center;background:var(--accent);color:#0b2428;text-decoration:none;font-size:14px;font-weight:800;letter-spacing:.055em;padding:18px 25px;border-radius:10px;white-space:nowrap;transition:transform .18s,background .18s}.download-button:hover{background:#84f6d0;transform:translateY(-2px)}.download-button svg{height:19px;width:19px}
    footer{border-top:1px solid var(--stroke);padding:28px 0 35px;color:#89a4b2;font-size:12px;text-align:center}
    @media(max-width:760px){.site{width:min(100% - 36px,600px)}.topbar{height:70px}.hero{grid-template-columns:1fr;gap:32px;padding:54px 0 45px}.hero-title{font-size:clamp(47px,10vw,70px)}.platform{margin-top:18px}.gallery{padding:38px 0}.arrow{width:32px;height:38px;font-size:23px}.arrow.prev{left:8px}.arrow.next{right:8px}.download{padding:24px;align-items:stretch;flex-direction:column;margin-bottom:36px}.download-button{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

    /* Revised layout: title, download, carousel. */
    .topbar{height:auto;min-height:122px;padding:30px 0 28px}
    .brand{font-size:clamp(29px,4.6vw,52px);letter-spacing:.055em;line-height:1.12}
    .download{margin:40px 0 40px;padding:36px 38px}
    .gallery{padding:45px 0 55px}
    @media(max-width:760px){
      .topbar{min-height:98px;padding:24px 0}
      .brand{font-size:clamp(26px,7vw,42px)}
      .download{margin:26px 0;padding:24px}
      .gallery{padding:30px 0 40px}
    }
  
    .download-button[data-state="loading"]{opacity:.65;cursor:wait;pointer-events:none}
    .download-button[data-state="error"]{background:#274958;color:#e3f2f7}
    .download-button[data-state="error"]:hover{background:#356075}
</style>
</head>
<body>
<div class="site">
<header class="topbar"><div class="brand">SNOWBOARD <span class="accent">RUNNER</span></div></header>
<main>
<section class="download" id="download">
<div><h2>DOWNLOAD</h2><p>Snowboard Runner  ·  Windows  ·  <span id="game-version">Checking version…</span></p></div>

<a aria-disabled="true" aria-label="Checking latest game release" class="download-button" data-state="loading" href="https://github.com/freamdev/snowboard-runner/releases/latest" rel="noopener noreferrer" target="_blank"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"></path></svg> DOWNLOAD GAME</a>
</section>
<div class="rule"></div>
<section aria-label="Game screenshots" class="gallery">
<div class="gallery-frame" id="gallery">
<div class="slide-window">
<img alt="Snowboard Runner gameplay on a snowy mountain" class="slide active" decoding="async" loading="eager" src="screenshots/gameplay-mountains.png"/>
<img alt="Snowboard Runner gameplay and avalanche" class="slide" decoding="async" loading="eager" src="screenshots/gameplay-avalanche.png"/>
<img alt="Rider selection screen" class="slide" decoding="async" loading="eager" src="screenshots/character-selection.png"/>
<img alt="Main menu" class="slide" decoding="async" loading="eager" src="screenshots/main-menu.png"/>
<button aria-label="Previous screenshot" class="arrow prev">‹</button>
<button aria-label="Next screenshot" class="arrow next">›</button>
</div>
<div aria-label="Choose screenshot" class="dots">
<button aria-current="true" aria-label="Screenshot 1" class="dot active"></button>
<button aria-label="Screenshot 2" class="dot"></button>
<button aria-label="Screenshot 3" class="dot"></button>
<button aria-label="Screenshot 4" class="dot"></button>
</div>
</div>
</section>
</main>
<footer>Snowboard Runner  ·  Fream</footer>
</div>
<script>
(()=>{const gallery=document.getElementById('gallery');const slides=[...gallery.querySelectorAll('.slide')];const dots=[...gallery.querySelectorAll('.dot')];let index=0,timer;function show(n){index=(n+slides.length)%slides.length;slides.forEach((s,i)=>s.classList.toggle('active',i===index));dots.forEach((d,i)=>{d.classList.toggle('active',i===index);if(i===index)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current')})}function next(){show(index+1)}function start(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;stop();timer=setInterval(next,5500)}function stop(){clearInterval(timer)}gallery.querySelector('.next').addEventListener('click',()=>{next();start()});gallery.querySelector('.prev').addEventListener('click',()=>{show(index-1);start()});dots.forEach((d,i)=>d.addEventListener('click',()=>{show(i);start()}));gallery.addEventListener('mouseenter',stop);gallery.addEventListener('mouseleave',start);gallery.addEventListener('focusin',stop);gallery.addEventListener('focusout',e=>{if(!gallery.contains(e.relatedTarget))start()});document.addEventListener('visibilitychange',()=>document.hidden?stop():start());start()})();
</script>
<script>
// Public GitHub Releases API; no API key or separate backend required.
(async () => {
  const api = 'https://api.github.com/repos/freamdev/snowboard-runner/releases/latest';
  const releasesPage = 'https://github.com/freamdev/snowboard-runner/releases';
  const button = document.querySelector('.download-button');
  const version = document.getElementById('game-version');
  const text = [...button.childNodes].find(node => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
  const setButtonText = value => { if (text) text.textContent = ' ' + value; };

  // Until a valid release is verified, don't send visitors to a placeholder.
  button.addEventListener('click', event => {
    if (button.dataset.state === 'loading') event.preventDefault();
  });

  try {
    const response = await fetch(api, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!response.ok) throw new Error('GitHub API request failed');
    const release = await response.json();
    const zip = release.assets?.find(asset => asset.name.toLowerCase().endsWith('.zip') && asset.browser_download_url);
    if (!zip) throw new Error('No ZIP attached to the latest release');

    version.textContent = release.tag_name || release.name || 'Latest';
    button.href = zip.browser_download_url;
    button.dataset.state = 'ready';
    button.removeAttribute('aria-disabled');
    button.setAttribute('aria-label', 'Download Snowboard Runner ' + version.textContent);
  } catch (error) {
    // No misleading version or broken ZIP URL if the API is unreachable.
    version.textContent = 'Latest release';
    button.href = releasesPage;
    button.dataset.state = 'error';
    button.removeAttribute('aria-disabled');
    button.setAttribute('aria-label', 'View available Snowboard Runner releases');
    setButtonText('VIEW RELEASES');
    console.warn('Could not retrieve latest release:', error);
  }
})();
</script></body></html>
